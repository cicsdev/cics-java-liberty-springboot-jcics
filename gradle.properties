# Centralized Java version for Gradle toolchain and Maven compiler
# Spring Boot 4.x: opinionated baseline Java 21 (SB4 minimum is 17)
java_version = 21

# CICS TS BOM version — dot-notation aligns with Maven property <cics.bom.version>
# Referenced in build.gradle as: ${project.property('cics.bom.version')}
cics.bom.version=6.1-20250812133513-PH63856

# Gradle daemon and parallel builds for better performance
org.gradle.daemon=true
org.gradle.parallel=true

# Enable toolchain auto-provisioning to download JDKs if not found locally
# This allows builds to work even if the specific Java version isn't installed
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true

# Configuration cache disabled due to CICS Bundle Plugin 1.0.8 incompatibility
# org.gradle.configuration-cache=true
